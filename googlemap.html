
<!DOCTYPE html>
<html>
<head>
    <title>My Google Map</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: lightblue;
        }

        h1 {
            color: darkblue;
        }

        iframe {
            border: 5px solid white;
            border-radius: 15px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            background-color: navy;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: orange;
        }
    </style>

</head>

<body>

<script>

document.writeln("<h1>MY GOOGLE MAP</h1>");

document.writeln("<br><br>");
